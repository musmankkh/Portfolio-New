<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="UA monogram">
  <title>Usman Asghar</title>
  <defs>
    <!-- userSpaceOnUse, not the default objectBoundingBox: a horizontal
         crossbar has a zero-height bbox, which makes a bbox-relative gradient
         degenerate (element not rendered). It also keeps one continuous ramp
         across the whole mark instead of restarting per path. -->
    <linearGradient id="ua" gradientUnits="userSpaceOnUse" x1="8" y1="76" x2="88" y2="12">
      <stop offset="0%" stop-color="#0B2E7A" />
      <stop offset="45%" stop-color="#1478E8" />
      <stop offset="100%" stop-color="#31D4FF" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#ua)" stroke-linecap="round" stroke-linejoin="round">
    <!-- U: narrowed to free up width for the A -->
    <path d="M16 27 L16 52 C16 65 22 72 30 72 C38 72 44 65 44 52 L44 31" stroke-width="10.5" />
    <!-- A: 38-wide base against a 10.5 stroke, so the counter stays open -->
    <path d="M50 74 L69 26 L88 74" stroke-width="10.5" />
    <!-- Crossbar, low enough that the legs have spread clear of it -->
    <path d="M57 63 L81 63" stroke-width="6.5" />
  </g>

  <!-- Pixel-dissolve cluster from the source mark -->
  <g fill="url(#ua)">
    <rect x="3" y="22" width="5" height="5" rx="1" />
    <rect x="10" y="13" width="6" height="6" rx="1" />
    <rect x="2" y="33" width="4" height="4" rx="1" />
    <rect x="11" y="4" width="5" height="5" rx="1" />
  </g>
</svg>
